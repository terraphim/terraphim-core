[package]
name = "terraphim_rolegraph"
version = "2.0.1"
edition.workspace = true
rust-version.workspace = true
authors = ["Terraphim Contributors"]
description = "Terraphim rolegraph module, which provides role handling for Terraphim AI."
documentation = "https://terraphim.ai"
homepage = "https://terraphim.ai"
repository.workspace = true
keywords = ["personal-assistant", "ai", "privacy", "roles", "rolegraph"]
license.workspace = true
readme = "README.md"
publish = ["crates-io"]

[dependencies]
terraphim_automata = { path = "../terraphim_automata", version = "2.1.0" }
terraphim_types = { path = "../terraphim_types", version = "1.22.3" }
terraphim_rolegraph_core = { path = "../terraphim_rolegraph_core", version = "0.1.1" }

ahash = { version = "0.8.3", features = ["serde"] }
aho-corasick = "1.0.2"
anyhow = { workspace = true, optional = true }

cached = { version = "0.56", features = ["proc_macro"] }
itertools = "0.14.0"
log = { workspace = true }

regex = "1.12.3"
serde = { workspace = true, features = ["derive"] }

serde_json = { workspace = true }

csv = { version = "1.3", optional = true }
thiserror = { workspace = true }

# RoleGraphSync only needs the async mutex. Do not inherit workspace Tokio
# "full": its native networking/runtime features prevent browser WASM builds.
tokio = { version = "1.0", default-features = false, features = ["sync"] }

ulid = { version = "1.0.0", features = ["serde", "uuid"] }
unicode-segmentation = "1.10.1"
url = "2.5.8"

[features]
default = []
medical = ["terraphim_types/medical", "csv", "anyhow"]
kg-integration = ["terraphim_types/kg-integration"]

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "symbolic_embedding_bench"
harness = false
required-features = ["medical"]

[dev-dependencies]
terraphim_rolegraph_core = { path = "../terraphim_rolegraph_core", version = "0.1.1" }

proptest = "1.4"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.8"
tempfile = { workspace = true }
tokio = { workspace = true }
terraphim_automata = { path = "../terraphim_automata", version = "2.1.0", features = ["tokio-runtime", "remote-loading"] }
