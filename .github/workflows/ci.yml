name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check release contracts and public manifests
        run: |
          python3 -m unittest discover -s tests -p 'test_crates_release.py' -v
          python3 -c 'from pathlib import Path; from scripts.crates_release import load_plan, validate_manifests; root = Path("."); validate_manifests(root, load_plan(root))'
      - name: Install pinned toolchain
        run: |
          rustup toolchain install 1.96 --profile minimal --component rustfmt --component clippy
          rustup target add wasm32-unknown-unknown --toolchain 1.96
      - name: Verify native and WASM source
        env:
          CARGO_HOME: ${{ runner.temp }}/core-cargo
        run: |
          set -euo pipefail
          cargo +1.96 fmt --all --check
          cargo +1.96 clippy --locked --workspace --all-targets -- -D warnings
          cargo +1.96 test --locked --workspace --all-targets
          cargo +1.96 check --locked --workspace --target wasm32-unknown-unknown --lib
