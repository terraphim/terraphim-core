[registry]
global-credential-providers = ["cargo:token"]

# Terraphim private Cargo registry (Gitea, terraphim org). Public-read; publishing
# needs CARGO_REGISTRIES_TERRAPHIM_TOKEN="Bearer $GITEA_TOKEN".
[registries.terraphim]
index = "sparse+https://git.terraphim.cloud/api/packages/terraphim/cargo/"
