name: frozen-public-api

# Guards the frozen public APIs. A change to the listed crates' public surface
# fails the job; intended changes must bump semver + update the baseline.
on:
  pull_request:

jobs:
  public-api-diff:
    runs-on: [self-hosted, bigbox]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Nightly toolchain (cargo-public-api requirement)
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-public-api
        run: cargo install cargo-public-api --locked

      - name: Diff frozen crates against base branch
        run: |
          set -euo pipefail
          for crate in terraphim_types terraphim_automata terraphim_rolegraph; do
            echo "== $crate =="
            cargo public-api -p "$crate" diff "origin/${GITHUB_BASE_REF:-main}..HEAD" --deny=all
          done
